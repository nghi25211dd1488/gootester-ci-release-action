name: Android Closed Testing Release & GOOtester Sync

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Incremented Play Console versionCode"
        required: true
        default: "2"
      version_name:
        description: "Semantic versionName"
        required: true
        default: "1.0.1"
      release_notes:
        description: "Summary of tester feedback resolved in this build"
        required: false
        default: "Resolved UI layout & stability feedback from closed testing cohort."

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build Signed Release Android App Bundle (.aab)
        run: ./gradlew :app:bundleRelease --no-daemon

      # Upload your signed .aab to Google Play Console -> Closed Testing track
      # (manually or via your preferred Play Developer API step), then record
      # version lineage + SHA-256 provenance in GOOtester:
      - name: Sync Release Lineage with GOOtester
        uses: nghi25211dd1488/gootester-ci-release-action@v1
        with:
          api-token: ${{ secrets.GOOTESTER_CI_TOKEN }}
          app-package: com.example.myapp
          version-code: ${{ inputs.version_code }}
          version-name: ${{ inputs.version_name }}
          aab-path: app/build/outputs/bundle/release/app-release.aab
          release-notes: ${{ inputs.release_notes }}
